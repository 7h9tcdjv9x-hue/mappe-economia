:root{
  --bg:#14161b; --ink:#eef1f5; --muted:#b3bbc6; --dim:#7f8894; --line:#8c95a1;
}
*{box-sizing:border-box}
html{color-scheme:dark}
html,body{margin:0;height:100%;background:#0b0c0f;overflow:hidden;color:var(--ink);
  font-family:"Source Sans 3","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#frame{position:fixed;inset:0;overflow:hidden;touch-action:manipulation}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;overflow:hidden;
  background:radial-gradient(1100px 650px at 22% 12%,#1c2027 0%,#14161b 62%,#111317 100%);cursor:default}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
.slide.cur{opacity:1;visibility:visible;transition:opacity .45s ease}
.notr, .notr *, .static *{transition:none !important}
.kicker{position:absolute;left:72px;top:36px;font-size:18px;font-weight:600;color:var(--acc)}
h2.title{position:absolute;left:72px;top:66px;margin:0;font-family:Barlow,"Segoe UI",system-ui,sans-serif;
  font-weight:600;font-size:46px;letter-spacing:-.2px;color:#f4f6f9}
.map{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
svg.wires{position:absolute;left:0;top:0;width:1600px;height:900px;overflow:visible;pointer-events:none}

/* reveal */
.rv{opacity:0;transform:translateY(8px);transition:opacity .45s ease var(--d,0s),transform .5s ease var(--d,0s)}
.rv.on{opacity:1;transform:none}
.wire{fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;
  transition:stroke-dashoffset .85s cubic-bezier(.45,.05,.25,1) var(--d,0s),opacity .2s ease var(--d,0s)}
.wire.on{stroke-dashoffset:0 !important;opacity:var(--o,1)}
.head{opacity:0;transition:opacity .3s ease var(--d,0s)}
.head.on{opacity:1}

/* mind map */
.root{position:absolute;padding:18px 28px 19px;border-radius:22px;text-align:center;color:#fff;
  box-shadow:0 14px 40px rgba(0,0,0,.35)}
.root .t{font-family:Barlow,"Segoe UI",system-ui,sans-serif;font-weight:600;font-size:38px;line-height:1.08}
.root .s{font-size:18px;line-height:1.35;opacity:.9;margin-top:7px}
.mn{position:absolute;padding-bottom:9px}
.mn.left{text-align:right}
.mn .k{font-size:17px;font-style:italic;color:var(--bc);margin-bottom:1px;white-space:nowrap}
.mn.l1 .t{font-size:26px;font-weight:600;line-height:1.2;color:#f3f5f8}
.mn.l2 .t{font-size:20.5px;line-height:1.3;color:#cdd3db}

/* free layout */
.fn{position:absolute}
.card{padding:14px 18px 15px;border-radius:16px;background:rgba(255,255,255,.045);border:1.5px solid var(--c)}
.card .k,.plain .k{font-size:15px;font-style:italic;color:var(--c);margin-bottom:2px}
.card .t{font-size:24px;font-weight:600;color:#f3f5f8;line-height:1.2}
.card .s{font-size:18.5px;line-height:1.35;color:#c3cad4;margin-top:5px}
.card.fill{background:var(--f);border-color:transparent}
.card.fill .t{color:#fff}.card.fill .s{color:rgba(255,255,255,.9)}.card.fill .k{color:rgba(255,255,255,.8)}
.center{text-align:center}

const NS = 'http://www.w3.org/2000/svg';
const stage = document.getElementById('stage');
const div = (cls, html) => { const e = document.createElement('div'); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
const svgEl = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const colorOf = (c) => (PAL[c] ? PAL[c].c : c);

function drawWire(svg, d, color, width, step, delay, opacity) {

// ---------- mind map ----------
function buildMind(sec, d, map, svg) {

    map.appendChild(n); b.el = n; b.w = n.offsetWidth; b.h = n.offsetHeight; b.lvl = lvl;
    b.c = (b.c || []).map((c, i) => { const o = typeof c === 'string' ? { t: c } : c; o.color = b.color; o.step = b.step; o.side = b.side; o.idx = i; mk(o, lvl + 1); return o; });
    b.g = 10; b.kh = b.c.reduce((s, c) => s + c.sh, 0) + b.g * Math.max(0, b.c.length - 1);
    b.sh = Math.max(b.h, b.kh);
  }
  function place(b, edgeX, top) {
    b.y = top + (b.sh - b.h) / 2; b.x = b.side === 'right' ? edgeX : edgeX - b.w;
    let ky = top + (b.sh - b.kh) / 2; const ce = b.side === 'right' ? b.x + b.w + HG2 : b.x - HG2;
    b.c.forEach((c) => { place(c, ce, ky); ky += c.sh + b.g; });
  }
  for (const side of ['left', 'right']) {
    const bs = order.filter((o) => o[0] === side).map((o) => o[1]);
    bs.forEach((b) => mk(b, 1));
    const tot = bs.reduce((s, b) => s + b.sh, 0) + VG1 * Math.max(0, bs.length - 1);
    let y = 450 - tot / 2; const ex = side === 'right' ? R.x + R.w + HG1 : R.x - HG1;
    bs.forEach((b) => { place(b, ex, y); y += b.sh + VG1; });
  }
  // bbox + fit
  const all = []; const walk = (b) => { all.push(b); b.c.forEach(walk); }; order.forEach(([, b]) => walk(b));
  let x0 = R.x, x1 = R.x + R.w, y0 = R.y, y1 = R.y + R.h;
  all.forEach((b) => { x0 = Math.min(x0, b.x); x1 = Math.max(x1, b.x + b.w); y0 = Math.min(y0, b.y); y1 = Math.max(y1, b.y + b.h); });
  fit(map, x0, y0, x1, y1, d.area);
  root.style.left = R.x + 'px'; root.style.top = R.y + 'px';
  all.forEach((b) => { b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px'; });
  // wires
  const ub = (b) => b.y + b.h - 1.5;
  order.forEach(([side, b]) => {
    const P0 = side === 'right' ? [R.x + R.w, R.y + R.h / 2] : [R.x, R.y + R.h / 2];
    connect(P0, b, 4.2, 0);
    reveal(b.el, b.step, 0.25);
    b.c.forEach((c, i) => {
      const Q0 = side === 'right' ? [b.x + b.w, ub(b)] : [b.x, ub(b)];
      connect(Q0, c, 2, 0.45 + i * 0.1, 0.85);
      reveal(c.el, c.step, 0.62 + i * 0.1);

  });
  function connect(P0, b, width, delay, op) {
    const y = ub(b); const P1 = b.side === 'right' ? [b.x, y] : [b.x + b.w, y]; const E = b.side === 'right' ? [b.x + b.w, y] : [b.x, y];
    const dx = P1[0] - P0[0];
    const dd = `M${P0[0]},${P0[1]} C${P0[0] + dx * 0.55},${P0[1]} ${P1[0] - dx * 0.55},${P1[1]} ${P1[0]},${P1[1]} L${E[0]},${E[1]}`;
    drawWire(svg, dd, b.color, width, b.step, delay, op);

  return order.length;
}

function fit(map, x0, y0, x1, y1, area) {
  const A = area || { x0: 56, x1: 1544, y0: 170, y1: 868 };
  const s = Math.min(1.15, (A.x1 - A.x0) / (x1 - x0), (A.y1 - A.y0) / (y1 - y0));
  const tx = (A.x0 + A.x1) / 2 - s * (x0 + x1) / 2, ty = (A.y0 + A.y1) / 2 - s * (y0 + y1) / 2;
  map.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  map.dataset.scale = s.toFixed(3);
}

// ---------- free layout ----------
function anchor(r, spec) {
  const [s, f = 0.5] = spec;
  if (s === 't') return [r.x + r.w * f, r.y];
  if (s === 'b') return [r.x + r.w * f, r.y + r.h];
  if (s === 'l') return [r.x, r.y + r.h * f];
  return [r.x + r.w, r.y + r.h * f];
}
function clipR(r, tx, ty) {
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2, dx = tx - cx, dy = ty - cy;
  const s = Math.min(dx ? r.w / 2 / Math.abs(dx) : 1e9, dy ? r.h / 2 / Math.abs(dy) : 1e9);
  return [cx + dx * s, cy + dy * s];
}
function buildFree(sec, d, map, svg) {
  const N = {}; let maxStep = 0;
  d.nodes.forEach((n) => {
    const person = n.cls.includes('person');
    let html = '';
    if (person) html += `<div class="av">${n.ini}</div><div>`;
    if (n.html) html += n.html;
    if (n.k) html += `<div class="k">${n.k}</div>`;
    if (n.t) html += `<div class="t">${n.t}</div>`;
    if (n.s) html += `<div class="s">${n.s}</div>`;
    if (person) html += '</div>';
    const e = div(`fn ${n.cls} rv`, html);
    const pc = PAL[n.c] || null;
    e.style.setProperty('--c', n.c ? colorOf(n.c) : PAL[d.pal].c);
    e.style.setProperty('--f', n.f || (pc ? pc.f : PAL[d.pal].f));
    if (n.w) e.style.width = n.w + 'px';
    map.appendChild(e);
    const w = e.offsetWidth, h = e.offsetHeight;
    const ccx = n.cxOf ? N[n.cxOf].x + N[n.cxOf].w / 2 : n.cx;
    let x = n.x !== undefined ? n.x : n.right !== undefined ? n.right - w : ccx - w / 2;
    let y = n.y !== undefined ? n.y : n.cy - h / 2;
    e.style.left = x + 'px'; e.style.top = y + 'px';
    N[n.id] = { x, y, w, h };
    reveal(e, n.step || 0, n.delay !== undefined ? n.delay : 0.1);
    maxStep = Math.max(maxStep, n.step || 0);
    if (n.cls.includes('formula')) e.querySelectorAll('[data-v]').forEach((sp) => {
      N[n.id + '-' + sp.dataset.v] = { x: x + sp.offsetLeft, y: y + sp.offsetTop + 10, w: sp.offsetWidth, h: sp.offsetHeight - 22 };
    });
  });
  (d.edges || []).forEach((ed) => {
    const A = N[ed.a], B = N[ed.b]; const step = ed.step || 0; maxStep = Math.max(maxStep, step);
    let P0 = ed.from ? anchor(A, ed.from) : null, P1 = ed.to ? anchor(B, ed.to) : null;
    if (!P0 && !P1) { P0 = clipR(A, B.x + B.w / 2, B.y + B.h / 2); P1 = clipR(B, A.x + A.w / 2, A.y + A.h / 2); }
    else if (!P0) P0 = clipR(A, P1[0], P1[1]); else if (!P1) P1 = clipR(B, P0[0], P0[1]);
    // gaps
    const dx = P1[0] - P0[0], dy = P1[1] - P0[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    P0 = [P0[0] + ux * 6, P0[1] + uy * 6]; P1 = [P1[0] - ux * 5, P1[1] - uy * 5];
    const bend = ed.bend || 0; const nx = -uy, ny = ux;
    const C = [(P0[0] + P1[0]) / 2 + nx * bend, (P0[1] + P1[1]) / 2 + ny * bend];
    const col = ed.c || '#8c95a1';
    const arrow = ed.arrow !== false;
    // tangent at end
    let tx = P1[0] - C[0], ty = P1[1] - C[1]; const tl = Math.hypot(tx, ty); tx /= tl; ty /= tl;
    const P1s = arrow ? [P1[0] - tx * 9, P1[1] - ty * 9] : P1;
    drawWire(svg, `M${P0[0]},${P0[1]} Q${C[0]},${C[1]} ${P1s[0]},${P1s[1]}`, col, ed.w || 2, step, 0.15);
    if (arrow) {
      const bx = P1[0] - tx * 13, by = P1[1] - ty * 13, px = -ty * 6.5, py = tx * 6.5;
      const head = svgEl('polygon', { points: `${P1[0]},${P1[1]} ${bx + px},${by + py} ${bx - px},${by - py}`, fill: col, class: 'head' });
      svg.appendChild(head); reveal(head, step, 0.85);

    if (ed.label) {
      const t = ed.lt !== undefined ? ed.lt : 0.5;
      const lx = (1 - t) * (1 - t) * P0[0] + 2 * (1 - t) * t * C[0] + t * t * P1[0] + (ed.lo ? ed.lo[0] : 0);
      const ly = (1 - t) * (1 - t) * P0[1] + 2 * (1 - t) * t * C[1] + t * t * P1[1] + (ed.lo ? ed.lo[1] : 0);
      const lab = div('elab rv' + (ed.lw ? ' wrap' : ''), ed.label);
      if (ed.lw) lab.style.width = ed.lw + 'px';
      lab.style.left = lx + 'px'; lab.style.top = ly + 'px';
      map.appendChild(lab); reveal(lab, step, 0.5);
    }
  });

  return maxStep;
}
function buildAxis(map, svg, N) {
  const y = 262, xa = 96, xb = 1504;
  const defs = svgEl('defs', {});
  const g = svgEl('linearGradient', { id: 'axg', x1: '0', x2: '1', y1: '0', y2: '0' });
  g.appendChild(svgEl('stop', { offset: '0', 'stop-color': '#5fcdbe' }));
  g.appendChild(svgEl('stop', { offset: '1', 'stop-color': '#aaa0f4' }));
  defs.appendChild(g); svg.appendChild(defs);
  const line = svgEl('rect', { x: xa + 10, y: y - 2, width: xb - xa - 20, height: 4, rx: 2, fill: 'url(#axg)', class: 'head' });
  svg.appendChild(line); reveal(line, 0, 0.1);
  const tri = (x, dir, col) => { const h = svgEl('polygon', { points: `${x},${y} ${x - dir * 16},${y - 9} ${x - dir * 16},${y + 9}`, fill: col, class: 'head' }); svg.appendChild(h); reveal(h, 0, 0.2); };
  tri(xa, -1, '#5fcdbe'); tri(xb, 1, '#aaa0f4');
  ['mer', 'fis', 'smi', 'say'].forEach((id, i) => {
    const n = N[id]; const cx = n.x + n.w / 2; const col = i < 2 ? '#5fcdbe' : '#aaa0f4';
    drawWire(svg, `M${cx},${y + 12} L${cx},${n.y - 6}`, '#5d6570', 2, i + 1, 0.05);
    const dot = svgEl('circle', { cx, cy: y, r: 11, fill: col, stroke: '#14161b', 'stroke-width': 4, class: 'head' });
    svg.appendChild(dot); reveal(dot, i + 1, 0);
  });
}

// ---------- cover / divider ----------
function buildCover(sec, d, map, svg) {
  const add = (cls, html, delay) => { const e = div(cls + ' rv', html); sec.appendChild(e); reveal(e, 0, delay); return e; };
  add('cv-small', 'Le grandi idee del pensiero economico', 0.05);
  add('cv-title', 'Dal mercantilismo al liberismo', 0.15);
  add('cv-sub', 'Mappe concettuali delle Schede 2, 3 e 4', 0.3);
  add('cv-help', 'Clicca, tocca o premi <kbd>→</kbd> per avanzare · <kbd>N</kbd> note del relatore · <kbd>F</kbd> schermo intero', 0.5);
  const hub = div('fn pill rv', '<div class="t" style="font-size:24px">economia</div>');
  hub.style.setProperty('--f', '#39404b'); map.appendChild(hub);
  const hx = 980, hy = 470; const hw = hub.offsetWidth, hh = hub.offsetHeight;
  hub.style.left = hx - hw / 2 + 'px'; hub.style.top = hy - hh / 2 + 'px'; reveal(hub, 0, 0.35);
  const items = [
    { k: 's2', n: '2', t: 'Mercantilismo e fisiocrazia', s: 'XVI – XVIII secolo', y: 250 },
    { k: 's3', n: '3', t: 'Rivoluzione industriale e capitalismo', s: 'fine XVIII – XX secolo', y: 470 },
    { k: 's4', n: '4', t: 'Il liberismo economico', s: 'Smith (1776) e Say', y: 690 },
  ];
  items.forEach((it, i) => {
    const e = div('fn card person rv', `<div class="av" style="font-size:24px;font-family:Barlow,'Segoe UI',sans-serif">${it.n}</div><div><div class="t">${it.t}</div><div class="s">${it.s}</div></div>`);
    e.style.setProperty('--c', PAL[it.k].c); e.style.setProperty('--f', PAL[it.k].f); e.style.width = '400px';
    map.appendChild(e); const h = e.offsetHeight; const x = 1140, y = it.y - h / 2;
    e.style.left = x + 'px'; e.style.top = y + 'px'; reveal(e, 0, 0.75 + i * 0.18);
    const P0 = [hx + hw / 2 + 4, hy], P1 = [x - 6, it.y]; const dx = P1[0] - P0[0];
    drawWire(svg, `M${P0[0]},${P0[1]} C${P0[0] + dx * 0.55},${P0[1]} ${P1[0] - dx * 0.55},${P1[1]} ${P1[0]},${P1[1]}`, PAL[it.k].c, 4, 0, 0.5 + i * 0.18);
  });
  return 0;
}
function buildDivider(sec, d) {
  const p = PAL[d.pal];
  sec.style.background = `radial-gradient(900px 700px at 82% 52%, ${p.f}40, transparent 70%)`;
  sec.style.setProperty('--c', p.c);
  const add = (cls, html, delay, tag) => { const e = document.createElement(tag || 'div'); e.className = cls + ' rv'; e.innerHTML = html; sec.appendChild(e); reveal(e, 0, delay); return e; };
  add('dv-num', d.num, 0);
  add('dv-lab', 'Scheda ' + d.num, 0.1);
  const t = add('dv-title', d.title, 0.18, 'h2');
  const q = add('dv-q', `«${d.quote}»<cite>${d.author}</cite>`, 0.4, 'blockquote');
  q.style.top = (228 + t.offsetHeight + 46) + 'px';
  add('dv-list', `<b>Le mappe di questa scheda</b>${d.list}`, 0.6);
  return 0;
}

const frame = document.getElementById('frame');
function scale() { const s = Math.min(frame.clientWidth / 1600, frame.clientHeight / 900); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', scale); addEventListener('orientationchange', scale); scale();
(async () => {
try {
  await Promise.race([
    Promise.all(['600 40px Barlow', '700 40px Barlow', '400 20px "Source Sans 3"', '600 24px "Source Sans 3"', 'italic 400 17px "Source Sans 3"'].map((f) => document.fonts.load(f, 'Aàè'))),
    new Promise((r) => setTimeout(r, 2500)),
  ]);
} catch (e) { /* fall back to system fonts */ }
// ---------- costruzione ----------
const built = SLIDES.map((d, i) => {
  const sec = document.createElement('section'); sec.className = 'slide'; sec.setAttribute('aria-label', `Slide ${i + 1}`);
  sec.style.setProperty('--acc', PAL[d.pal || 'ink'].c);
  stage.appendChild(sec);
  sec.classList.add('measure'); sec.style.visibility = 'visible';
  if (d.kicker) sec.appendChild(div('kicker', d.kicker));
  if (d.title && d.type !== 'divider') { const h = document.createElement('h2'); h.className = 'title'; h.textContent = d.title; sec.appendChild(h); }
  const map = div('map'); sec.appendChild(map);
  const svg = svgEl('svg', { class: 'wires', viewBox: '0 0 1600 900' }); map.appendChild(svg);
  let max = 0;
  if (d.type === 'mind') max = buildMind(sec, d, map, svg);
  else if (d.type === 'free') max = buildFree(sec, d, map, svg);
  else if (d.type === 'cover') max = buildCover(sec, d, map, svg);
  else if (d.type === 'divider') max = buildDivider(sec, d);
  sec.style.visibility = '';
  return { sec, max, d };
});

// ---------- navigazione ----------
const Q = new URLSearchParams(location.search);
if (Q.has('all')) document.documentElement.classList.add('static');
let cur = 0, step = 0;
const notesEl = document.getElementById('notes'), notesText = document.getElementById('notesText'), countEl = document.getElementById('count');
function apply(instant) {
  const s = built[cur];
  s.sec.querySelectorAll('[data-step]').forEach((e) => e.classList.toggle('on', +e.dataset.step <= step));
  countEl.textContent = `${cur + 1} / ${built.length}` + (s.max ? `  ·  ${step}/${s.max}` : '');
  notesText.textContent = s.d.notes || '';
}
function go(i, atEnd) {
  i = Math.max(0, Math.min(built.length - 1, i));
  const old = built[cur].sec; const nxt = built[i].sec;
  if (i !== cur || !nxt.classList.contains('cur')) {
    old.classList.remove('cur');
    nxt.classList.add('notr'); nxt.querySelectorAll('.on').forEach((e) => e.classList.remove('on')); void nxt.offsetWidth; nxt.classList.remove('notr');
    cur = i; step = atEnd || Q.has('all') ? built[i].max : 0; nxt.classList.add('cur');
    setTimeout(apply, 40);
  }
}
function toggleFull() {
  try {
    const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* the viewer may refuse it: the page still works */ }
}
function next() { if (step < built[cur].max) { step++; apply(); } else if (cur < built.length - 1) go(cur + 1, false); }
function prev() { if (step > 0) { step--; apply(); } else if (cur > 0) go(cur - 1, true); }
document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (['ArrowRight', 'PageDown', ' ', 'Enter', 'ArrowDown'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace', 'ArrowUp'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'Home') go(0, false);
  else if (k === 'End') go(built.length - 1, true);
  else if (k === 'n' || k === 'N') notesEl.classList.toggle('open');
  else if (k === 'f' || k === 'F') toggleFull();
});
frame.addEventListener('click', (e) => { if (e.clientX < innerWidth * 0.25) prev(); else next(); });
let t0 = null;
frame.addEventListener('touchstart', (e) => { const p = e.touches[0]; t0 = e.touches.length === 1 ? { x: p.clientX, y: p.clientY, t: Date.now() } : null; }, { passive: true });
frame.addEventListener('touchend', (e) => {
  if (!t0 || e.touches.length) return;
  const p = e.changedTouches[0], dx = p.clientX - t0.x, dy = p.clientY - t0.y, dt = Date.now() - t0.t; t0 = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); (dx < 0 ? next : prev)(); }
  else if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 600) { e.preventDefault(); if (p.clientX < innerWidth * 0.25) prev(); else next(); }
}, { passive: false });
const start = parseInt(location.hash.slice(1), 10);
cur = 0; built[0].sec.classList.add('cur'); step = 0;
if (start > 1) go(start - 1, false); else setTimeout(apply, 40);

// controllo sovrapposizioni (uso: audit() dalla console)
window.audit = function () {
  const out = [];
  built.forEach((b, i) => {
    b.sec.classList.add('notr'); b.sec.style.visibility = 'visible';
    b.sec.querySelectorAll('[data-step]').forEach((e) => e.classList.add('on'));
    const sr = stage.getBoundingClientRect(); const k = sr.width / 1600;
    const rect = (e) => { const r = e.getBoundingClientRect(); return { x: (r.left - sr.left) / k, y: (r.top - sr.top) / k, w: r.width / k, h: r.height / k, e }; };
    const els = [...b.sec.querySelectorAll('.root,.mn,.fn,.elab,.kicker,h2.title,.dv-title,.dv-q,.dv-list,.cv-title,.cv-sub,.cv-small,.cv-help')].map(rect);
    for (let a = 0; a < els.length; a++) {
      const r = els[a];
      if (r.x < 20 || r.y < 20 || r.x + r.w > 1580 || r.y + r.h > 885) out.push(`slide ${i + 1}: fuori bordo «${r.e.textContent.slice(0, 30)}»`);
      for (let c = a + 1; c < els.length; c++) {
        const s = els[c];
        if (r.e.contains(s.e) || s.e.contains(r.e)) continue;
        if (r.x < s.x + s.w && s.x < r.x + r.w && r.y < s.y + s.h && s.y < r.y + r.h) out.push(`slide ${i + 1}: «${r.e.textContent.slice(0, 28)}» ~ «${s.e.textContent.slice(0, 28)}»`);
      }
    }
    const m = b.sec.querySelector('.map'); if (m && m.dataset.scale && +m.dataset.scale < 1) out.push(`slide ${i + 1}: mappa ridotta a ${m.dataset.scale}`);
    b.sec.style.visibility = ''; b.sec.classList.remove('notr');
  });
  go(cur, false); apply();
  return out;
};

// on-screen controls: visible while the pointer moves, out of the way while presenting
const ctl = document.getElementById('ctl');
const stop = (fn) => (e) => { e.stopPropagation(); fn(); };
document.getElementById('bPrev').addEventListener('click', stop(prev));
document.getElementById('bNext').addEventListener('click', stop(next));
document.getElementById('bNotes').addEventListener('click', stop(() => notesEl.classList.toggle('open')));
const bFull = document.getElementById('bFull');
if (document.fullscreenEnabled) bFull.addEventListener('click', stop(toggleFull)); else bFull.hidden = true;
let idleT;
function wake(ms) { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), ms); }
addEventListener('pointermove', () => wake(2600));
addEventListener('pointerdown', () => wake(3200));
wake(6000);
try { window.focus(); } catch (e) { /* not needed for clicks */ }
})();
</script>
